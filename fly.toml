# ACHI BOT uchun Fly.io konfiguratsiyasi.
#
# MUHIM: bu bot HTTP server emas (Telegram bilan "long polling" orqali
# ishlaydi), shu sabab bu faylda ataylab [http_service] bo'limi YO'Q.
# Agar shu bo'lim qo'shilsa, Fly.io HTTP health-check kutadi, bot esa
# hech qanday portni tinglamagani uchun health-check muvaffaqiyatsiz
# tugaydi va deploy "failed" bo'ladi - aynan shu narsa avvalgi xatoning
# eng ehtimoliy sababi edi.
#
# `app` nomini flyctl orqali ("fly launch" yoki "fly apps create") o'zingiz
# tanlagan nomga moslab o'zgartirishingiz kerak bo'ladi.
app = "achi-bot"
primary_region = "ams"

[build]

[env]
  DB_PATH = "/app/data/achi_bot.db"
  REPORTS_DIR = "/app/data/reports"

[processes]
  worker = "python main.py"

# Doim ishlab tursin, avtomatik to'xtamasin/uxlamasin (bepul foydalanish
# limitiga sig'ish uchun 1 ta kichik VM yetarli).
[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "256mb"

# Ma'lumotlar bazasi (SQLite) va PDF/CSV fayllarni saqlash uchun doimiy
# disk. Volume'ni oldindan yaratish kerak:
#   fly volumes create achi_data --size 1 --region ams
[mounts]
  source = "achi_data"
  destination = "/app/data"
